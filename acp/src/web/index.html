<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Control Plane</title>
<style>
:root{
  --bg:#0a0c10; --surface:#12151d; --surface2:#181c26; --surface3:#1f2432;
  --border:#242a38; --border2:#2e3546;
  --text:#e8ebf4; --dim:#98a0b3; --faint:#5d6577;
  --acc1:#5b7cfa; --acc2:#9a6bff; --ok:#34d399; --warn:#fbbf24; --err:#f87171;
  --mono:'Cascadia Code',Consolas,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;display:flex}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2b3244;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#39415a}
::-webkit-scrollbar-track{background:transparent}

/* ---------- sidebar ---------- */
aside{width:252px;min-width:252px;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.brand{font-size:15px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--acc1),var(--acc2));display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff;box-shadow:0 2px 12px rgba(91,124,250,.4)}
.brand small{color:var(--faint);font-weight:400;margin-left:auto;font-size:11px}
.side-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.side-title{font-size:10px;letter-spacing:1.6px;color:var(--faint);font-weight:700;margin:4px 2px 0}
.budget-row{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding:2px 0}
.budget-row b{color:var(--text);font-family:var(--mono)}
.agent{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s}
.agent:hover{background:var(--surface3)}
.agent.sel{background:var(--surface3);border-color:var(--acc1)}
.avatar{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:.5px}
.agent .info{flex:1;min-width:0}
.agent .nm{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.agent .sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent .vn{font-size:10px;color:var(--warn);margin-top:1px}
.agent .vn.dim{color:var(--dim)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block;flex-shrink:0}
.dot.ok{background:var(--ok);box-shadow:0 0 6px rgba(52,211,153,.7)}
.dot.err{background:var(--err)}
.dot.warn{background:var(--warn)}
.dot.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
.side-foot{margin-top:auto;font-size:10px;color:var(--faint);line-height:1.5;padding:0 2px}

/* ---------- main ---------- */
main{flex:1;height:100vh;overflow-y:auto;padding:0 26px 40px}
header.main{display:flex;align-items:center;gap:12px;padding:16px 2px 6px;position:sticky;top:0;background:linear-gradient(var(--bg) 82%,transparent);z-index:5}
header.main h1{font-size:17px;font-weight:700}
header.main .conn{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim)}
button.ghost{background:var(--surface2);border:1px solid var(--border);color:var(--dim);border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;transition:.15s}
button.ghost:hover{color:var(--text);border-color:var(--border2)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 4px 24px rgba(0,0,0,.25)}
.card+.card{margin-top:16px}
h2.ct{font-size:11px;letter-spacing:1.6px;color:var(--faint);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h2.ct .n{background:var(--surface3);border-radius:99px;padding:0 8px;font-size:10px;color:var(--dim)}

/* tabs & presets */
.tabs{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.tabs button{border:0;background:transparent;color:var(--dim);font-size:12.5px;font-weight:600;padding:6px 16px;border-radius:8px;cursor:pointer;transition:.15s}
.tabs button.on{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;box-shadow:0 2px 10px rgba(91,124,250,.35)}
.presets{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.presets button{background:var(--surface2);border:1px solid var(--border);color:var(--dim);border-radius:99px;padding:4px 12px;font-size:12px;cursor:pointer;transition:.15s}
.presets button:hover{color:var(--text);border-color:var(--acc1);background:var(--surface3)}

label{display:block;font-size:11px;color:var(--dim);margin:11px 0 4px;font-weight:600;letter-spacing:.3px}
textarea,input,select{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:9px 11px;font:13px var(--mono);transition:border-color .15s}
textarea{resize:vertical;min-height:90px;line-height:1.55}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--acc1);box-shadow:0 0 0 3px rgba(91,124,250,.15)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;cursor:pointer;user-select:none}
.check input{width:15px;height:15px;accent-color:var(--acc1)}
#btn-go{width:100%;margin-top:16px;padding:11px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.5px;box-shadow:0 4px 18px rgba(91,124,250,.35);transition:.15s}
#btn-go:hover{filter:brightness(1.12);transform:translateY(-1px)}
#btn-go:disabled{opacity:.6;cursor:wait;transform:none}
.form-err{color:var(--err);font-size:12px;margin-top:8px;font-family:var(--mono);min-height:16px}

/* ---------- jobs ---------- */
.jobs-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.jobs-head h2{font-size:15px;font-weight:700;margin-right:4px}
.fchip{background:var(--surface2);border:1px solid var(--border);color:var(--dim);border-radius:99px;padding:3px 12px;font-size:12px;cursor:pointer;transition:.15s}
.fchip.on{color:#fff;border-color:var(--acc1);background:var(--surface3)}
.fsel{width:auto;background:var(--surface2);border:1px solid var(--border);color:var(--dim);border-radius:99px;padding:3px 10px;font-size:12px}
.fsearch{width:150px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:99px;padding:4px 12px;font-size:12px}
.jobs-head .spacer{flex:1}

.job{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--faint);border-radius:12px;margin-bottom:10px;animation:in .25s ease;overflow:hidden}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.job.st-running{border-left-color:var(--acc1)}
.job.st-ok{border-left-color:var(--ok)}
.job.st-err{border-left-color:var(--err)}
.job-h{display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;flex-wrap:wrap}
.job-h:hover{background:var(--surface2)}
.pill{padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.3px;flex-shrink:0}
.pill.running{background:rgba(91,124,250,.15);color:#9db4ff}
.pill.ok{background:rgba(52,211,153,.13);color:var(--ok)}
.pill.err{background:rgba(248,113,113,.13);color:var(--err)}
.pill.batch{background:rgba(154,107,255,.15);color:#c3a6ff}
.jid{font-family:var(--mono);font-size:11px;color:var(--faint)}
.jtask{flex:1;min-width:180px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jmeta{color:var(--faint);font-size:11.5px;font-family:var(--mono);flex-shrink:0}
.jbody{border-top:1px solid var(--border);padding:13px 15px;display:none}
.job.open .jbody{display:block}
.job.open{border-color:var(--border2)}

.livelog{background:#0c0e13;border:1px solid var(--border);border-radius:9px;padding:9px 11px;max-height:200px;overflow-y:auto;font:12px var(--mono);margin-bottom:12px}
.livelog .ev{padding:1.5px 0;color:var(--dim);word-break:break-all}
.livelog .ev.t-text{color:#b8c4e0}
.livelog .ev.t-tool{color:var(--warn)}
.livelog .ev.t-status{color:var(--faint);font-style:italic}
.livelog .ev.t-done{color:var(--ok)}
.livelog .ev .k{opacity:.6;margin-right:6px;user-select:none}

.reply{background:#0c0e13;border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-size:13px;white-space:pre-wrap;word-break:break-word;max-height:380px;overflow-y:auto;line-height:1.65}
.verdict{background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.25);border-radius:9px;padding:11px 13px;margin-top:10px;font-size:12.5px}
.verdict b{color:var(--ok)}
.verdict ul{margin:6px 0 0 18px}
.rrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--dim)}
.rrow b{color:var(--text);font-family:var(--mono)}
details.raw{margin-top:10px}
details.raw summary{cursor:pointer;font-size:12px;color:var(--faint)}
details.raw pre{margin-top:6px}
pre.rawj{background:#0c0e13;border:1px solid var(--border);border-radius:9px;padding:11px;font:11.5px var(--mono);white-space:pre-wrap;word-break:break-all;max-height:320px;overflow-y:auto;color:#9aa6c4}
.btn-copy{background:var(--surface3);border:1px solid var(--border);color:var(--dim);border-radius:7px;padding:3px 10px;font-size:11px;cursor:pointer;margin-top:8px}
.btn-copy:hover{color:var(--text)}
.subchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.schip{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:4px 11px;font-size:12px;color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schip.ok{border-color:rgba(52,211,153,.4)}
.schip.err{border-color:rgba(248,113,113,.4);color:var(--err)}
.schip.run{border-color:rgba(91,124,250,.4);color:#9db4ff}
.empty{color:var(--faint);text-align:center;padding:44px 0;font-size:13px}
.topnav{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:3px}
.navbtn{border:0;background:transparent;color:var(--dim);font-size:13px;font-weight:600;padding:6px 16px;border-radius:8px;cursor:pointer;transition:.15s}
.navbtn.on{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;box-shadow:0 2px 10px rgba(91,124,250,.35)}
.setgrid{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:start}
@media(max-width:900px){.setgrid{grid-template-columns:1fr}}
.subnav{display:flex;flex-direction:column;gap:4px;position:sticky;top:64px}
.subnav .navbtn{text-align:left}
.subnav .tag{float:right;font-size:10px;color:var(--faint);font-weight:400}
.credstrip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.credchip{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 11px;font-size:12px;color:var(--dim);display:flex;gap:7px;align-items:center}
.agentrow{border:1px solid var(--border);border-radius:11px;background:var(--surface2);margin-bottom:8px;overflow:hidden}
.agentrow .arow{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;flex-wrap:wrap}
.agentrow .arow:hover{background:var(--surface3)}
.agentrow.open{border-color:var(--acc1)}
.agentrow .aedit{display:none;border-top:1px solid var(--border);padding:13px}
.agentrow.open .aedit{display:block}
.badge-dis{background:#3a2f1c;color:var(--warn);border-radius:99px;padding:1px 9px;font-size:11px;font-weight:700}
.probebox{background:#0c0e13;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font:12px var(--mono);margin-top:9px;white-space:pre-wrap;word-break:break-all}
.switch{position:relative;width:34px;height:19px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--surface3);border:1px solid var(--border2);border-radius:99px;cursor:pointer;transition:.2s}
.switch span::after{content:'';position:absolute;width:13px;height:13px;border-radius:50%;background:var(--dim);top:2px;left:2px;transition:.2s}
.switch input:checked+span{background:rgba(52,211,153,.25);border-color:var(--ok)}
.switch input:checked+span::after{background:var(--ok);transform:translateX(15px)}
.rule-row{display:flex;gap:10px;align-items:center;margin-bottom:9px}
.rule-row b{width:80px;flex-shrink:0}
.rule-row select{flex:1.4}
.rule-row input{flex:1}
.chip-x{background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:4px 8px 4px 12px;font:12px var(--mono);color:var(--dim);display:inline-flex;gap:6px;align-items:center;margin:0 6px 6px 0}
.chip-x button{background:none;border:0;color:var(--err);cursor:pointer;font-size:12px;padding:0 2px}
.usage-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);padding:4px 0;border-bottom:1px dashed var(--border)}
.usage-row b{color:var(--text);font-family:var(--mono)}
.sidenav{display:flex;flex-direction:column;gap:2px;margin-top:-4px}
.navrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;color:var(--dim);font:500 13.5px/1 Montserrat,'PingFang SC','Microsoft YaHei',sans-serif;padding:9px 11px;border-radius:var(--dsw-radius-sm);cursor:pointer;transition:background .12s}
.navrow:hover{background:#ffffff14;color:var(--text)}
.navrow.on{background:var(--dsw-alias-bg-layer-2);color:var(--text)}
.navico{font-size:13px;opacity:.85;width:15px;text-align:center}

/* =====================================================================================
   dsh design system — token values copied verbatim from @deepseek-ai/dsh-client-ui-theme
   (DeepSeek Harness, MIT License). Font: Montserrat, SIL Open Font License (fonts/).
   We re-map our palette variables onto dsh's real tokens so the whole UI inherits its
   look: bg-base/layer ramp, half-pixel elevation stroke, radii scale, brand blue.
   ===================================================================================== */
@font-face{font-family:'Montserrat';font-style:normal;font-weight:400;font-display:swap;src:url(./fonts/montserrat-regular.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:300;font-display:swap;src:url(./fonts/montserrat-light.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:500;font-display:swap;src:url(./fonts/montserrat-medium.woff2) format('woff2')}

:root{
  /* raw palette (dsw-static-*) */
  --dsw-neutral-bluish-950:#151517; --dsw-neutral-bluish-875:#232324;
  --dsw-neutral-bluish-850:#2c2c2e; --dsw-neutral-bluish-800:#353638;
  --dsw-neutral-bluish-400:#adb2b8; --dsw-neutral-bluish-600:#81858c; --dsw-neutral-bluish-700:#61666b;
  --dsw-deepseek-500:#4176e6; --dsw-deepseek-450:#5686fe;
  --dsw-red-400:#f25a5a; --dsw-amber:#f7ad31; --dsw-green-400:#4ed17e; --dsw-green-500:#22c55e;
  /* alias tokens (dsw-alias-*, dark theme) */
  --dsw-alias-bg-base:var(--dsw-neutral-bluish-950);
  --dsw-alias-bg-layer-1:var(--dsw-neutral-bluish-875);
  --dsw-alias-bg-layer-2:var(--dsw-neutral-bluish-850);
  --dsw-alias-bg-layer-3:var(--dsw-neutral-bluish-800);
  --dsw-alias-settings-card-fill:var(--dsw-alias-bg-layer-2);
  --dsw-alias-border-l1:#ffffff0f; --dsw-alias-border-l2:#ffffff1f;
  --dsw-alias-border-l3:#ffffff29; --dsw-alias-border-l4:#ffffff33;
  --dsw-alias-brand-text:#f9fafb;
  --dsw-alias-brand-primary:#4176e6;      /* deepseek-500 */
  --dsw-alias-brand-primary-hover:#5686fe;/* deepseek-450 */
  --dsw-alias-state-error-primary:var(--dsw-red-400);
  --dsw-alias-state-success-primary:var(--dsw-green-500);
  --dsw-alias-bg-hover:#ffffff14;
  /* geometry (dsw-radius-*/ --dsw-shadow-*/ --dsw-elevation-*) */
  --dsw-radius-xs:4px; --dsw-radius-sm:8px; --dsw-radius-md:12px;
  --dsw-radius-lg:16px; --dsw-radius-xl:20px; --dsw-radius-panel:28px;
  --dsw-elevation-stroke:0 0 0 .5px var(--dsw-alias-border-l3);
  --dsw-shadow-lv1:0 2px 4px 0 #0000000d;
  --dsw-shadow-lv2:0 4px 12px 0 #00000005, 0 2px 8px 0 #0000000a;
  --dsw-elevation-panel:var(--dsw-elevation-stroke), 0 3px 8px 0 #00000008, 0 0 16px 0 #00000005;
  /* re-map our palette vars onto dsh tokens */
  --bg:var(--dsw-alias-bg-base);
  --surface:var(--dsw-alias-settings-card-fill);
  --surface2:var(--dsw-alias-bg-layer-1);
  --surface3:var(--dsw-alias-bg-layer-3);
  --border:var(--dsw-alias-border-l1);
  --border2:var(--dsw-alias-border-l2);
  --text:var(--dsw-alias-brand-text);
  --dim:var(--dsw-neutral-bluish-400);
  --faint:var(--dsw-neutral-bluish-600);
  --acc1:var(--dsw-alias-brand-primary);
  --acc2:var(--dsw-alias-brand-primary-hover);
  --ok:var(--dsw-alias-state-success-primary);
  --warn:var(--dsw-amber);
  --err:var(--dsw-alias-state-error-primary);
  --mono:'Cascadia Code',Consolas,'Courier New',monospace;
}
body{font-family:Montserrat,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;letter-spacing:.012em}
/* dsh signature: half-pixel stroke instead of solid 1px borders; real radii scale */
.card{background:var(--dsw-alias-settings-card-fill);border:0;border-radius:var(--dsw-radius-lg);box-shadow:var(--dsw-elevation-stroke), var(--dsw-shadow-lv2)}
aside{background:var(--dsw-alias-bg-base);border-right:0;box-shadow:var(--dsw-elevation-stroke)}
header.main{background:linear-gradient(var(--dsw-alias-bg-base) 82%,transparent)}
.side-card,.agentrow,.job,.credchip,.chip-x,.schip,.usage-row{box-shadow:var(--dsw-elevation-stroke)}
.side-card{border:0;border-radius:var(--dsw-radius-md);background:var(--dsw-alias-bg-layer-1)}
.agentrow,.job{border:0;border-radius:var(--dsw-radius-md);background:var(--dsw-alias-bg-layer-1)}
.agentrow.open,.job.open{border-radius:var(--dsw-radius-md);box-shadow:0 0 0 1.5px var(--dsw-alias-brand-primary)}
input,textarea,select{background:var(--dsw-alias-bg-layer-1);border:0;border-radius:var(--dsw-radius-sm);box-shadow:var(--dsw-elevation-stroke)}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 1.5px var(--dsw-alias-brand-primary)}
#btn-go,.brand .logo{background:var(--dsw-alias-brand-primary);background-image:none;box-shadow:none}
#btn-go:hover{background:var(--dsw-alias-brand-primary-hover);filter:none;transform:none}
.tabs{background:var(--dsw-alias-bg-layer-1);border:0;box-shadow:var(--dsw-elevation-stroke);border-radius:var(--dsw-radius-sm)}
.tabs button.on,.navbtn.on,.fchip.on{background:var(--dsw-alias-bg-layer-3);color:var(--text);box-shadow:none}
.navbtn{border-radius:var(--dsw-radius-xs)}
.navbtn:hover{background:var(--dsw-alias-bg-hover)}
button.ghost{background:transparent;border:0;box-shadow:var(--dsw-elevation-stroke);border-radius:var(--dsw-radius-sm)}
button.ghost:hover{background:var(--dsw-alias-bg-hover);color:var(--text)}
.pill,.fchip,.credchip,.chip-x,.presets button,.schip{border-radius:999px}
.presets button{background:var(--dsw-alias-bg-layer-1);border:0;box-shadow:var(--dsw-elevation-stroke)}
.presets button:hover{border-color:transparent;background:var(--dsw-alias-bg-layer-3)}
.livelog,.reply,pre.rawj,.probebox{background:var(--dsw-alias-bg-base);border:0;box-shadow:var(--dsw-elevation-stroke);border-radius:var(--dsw-radius-sm)}
.verdict{background:#22c55e14;border:0;box-shadow:0 0 0 1px #22c55e1f;border-radius:var(--dsw-radius-sm)}
.side-title,h2.ct{letter-spacing:.08em;font-weight:500}
.job-h:hover,.arow:hover{background:var(--dsw-alias-bg-hover)}
.subnav{background:var(--dsw-alias-bg-layer-1);border-radius:var(--dsw-radius-md);box-shadow:var(--dsw-elevation-stroke)}
::-webkit-scrollbar-thumb{background:#ffffff1f;border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:#ffffff29}
.dot.ok,.dot.err,.dot.warn{box-shadow:none}
</style>
</head>
<body>

<aside>
  <div class="brand"><span class="logo">◈</span> Control Plane <small>v0.3</small></div>
  <div class="sidenav">
    <button class="navrow on" id="nav-console" onclick="switchView('console')"><span class="navico">▤</span>控制台</button>
    <button class="navrow" id="nav-settings" onclick="switchView('settings')"><span class="navico">⚙</span>设置</button>
  </div>
  <div class="side-card" id="budget"></div>
  <div class="side-title">AGENTS · 点击选中</div>
  <div class="side-card" style="padding:6px;display:flex;flex-direction:column;gap:2px" id="agents"></div>
  <div class="side-foot">只绑定 127.0.0.1<br>作业：内存 + 历史文件<br>MCP 与 Web 共用同一 ControlPlane<br>design tokens: DeepSeek Harness (MIT)</div>
</aside>

<main>
  <header class="main">
    <h1 id="view-title">控制台</h1>
    <div class="conn"><span class="dot pulse" id="conn-dot"></span><span id="conn-text">连接中…</span></div>
    <button class="ghost" id="btn-clear">清空历史</button>
  </header>

  <div id="view-console">
  <section class="card">
    <h2 class="ct">发起任务</h2>
    <div class="tabs">
      <button id="tab-ask" class="on">单任务</button>
      <button id="tab-batch">批量并发</button>
    </div>
    <div class="presets" id="presets"></div>

    <div id="batch-box" style="display:none">
      <label>任务列表（每行一个任务，共用下方参数）</label>
      <textarea id="f-batchtasks" style="min-height:110px" placeholder="每行一个任务"></textarea>
      <div class="grid2"><div><label>并发数</label><input id="f-concurrency" type="number" value="3" min="1" max="8"></div></div>
    </div>

    <div id="ask-box">
      <label>任务描述</label>
      <textarea id="f-task" placeholder="要交给 agent 的任务，越具体越好"></textarea>
    </div>

    <label>工作目录 cwd</label>
    <input id="f-cwd" list="cwd-list" placeholder="绝对路径，例如 D:\projects\my-repo（派发后自动记入常用列表）">
    <datalist id="cwd-list"></datalist>

    <div class="grid3">
      <div><label>Agent</label>
        <select id="f-agent"><option value="">auto 路由</option></select></div>
      <div><label>模型（空=默认）</label><input id="f-model" list="model-list" placeholder="auto"><datalist id="model-list"></datalist></div>
      <div><label>思考档位</label><input id="f-effort" list="effort-list" placeholder="auto"><datalist id="effort-list"></datalist></div>
    </div>
    <div class="grid3">
      <div><label>任务类型</label>
        <select id="f-tasktype"><option value="">auto</option><option>quick</option><option>code</option><option>reasoning</option><option>review</option></select></div>
      <div><label>工作区隔离</label>
        <select id="f-wsmode"><option value="shared">shared 共享</option><option value="worktree">worktree 隔离</option></select></div>
      <div><label>工具调用上限</label><input id="f-maxtools" type="number" placeholder="不限"></div>
    </div>
    <label class="check"><input type="checkbox" id="f-verdict"> 结构化 verdict（JSON 结论/风险/建议，失败自动重试一次）</label>
    <button id="btn-go">🚀 派发任务</button>
    <div class="form-err" id="form-err"></div>
  </section>

  <section class="card" style="padding:16px 18px">
    <div class="jobs-head">
      <h2>作业</h2>
      <span class="fchip on" data-f="all">全部</span>
      <span class="fchip" data-f="running">运行中</span>
      <span class="fchip" data-f="ok">完成</span>
      <span class="fchip" data-f="err">失败</span>
      <select class="fsel" id="f-agent-filter"><option value="">全部 agent</option></select>
      <input class="fsearch" id="f-search" placeholder="搜索任务…">
      <span class="spacer"></span>
      <span class="jid" id="job-count"></span>
    </div>
    <div id="jobs"><div class="empty">暂无作业</div></div>
  </section>
  </div><!-- /view-console -->

  <div id="view-settings" style="display:none">
    <div class="setgrid">
      <div class="subnav card" style="padding:8px">
        <button class="navbtn on" data-s="agents" onclick="setSection('agents')">Agents</button>
        <button class="navbtn" data-s="routing" onclick="setSection('routing')">Routing</button>
        <button class="navbtn" data-s="budget" onclick="setSection('budget')">Budget</button>
        <button class="navbtn" data-s="workspace" onclick="setSection('workspace')">Workspace</button>
        <button class="navbtn" data-s="integr" onclick="setSection('integr')">集成</button>
      </div>
      <div id="settings-body"></div>
    </div>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
const COPYBUF={};
const AGENT_COLORS={opencode:'#3ecf8e',claude:'#f5a623',codex:'#4f8cff',dsh:'#c3a6ff'};
const AGENT_SHORT={opencode:'OC',claude:'CL',codex:'CX',dsh:'DS'};
/* FIX (P1): which vendor each adapter is EXPECTED to run. The backend reports the vendor the
   default model ACTUALLY runs on (adapter name != vendor). Only flag a mismatch against this
   expectation — previously any non-empty value rendered as a warning, so all four agents
   showed a bogus "实际厂商不同", including perfectly normal ones. */
const EXPECTED_VENDOR={claude:'anthropic',codex:'openai',dsh:'deepseek'};
function vendorNote(a){
  const v=a.actualVendorNote;if(!v)return '';
  if(v==='unknown')return `<div class="vn" title="该 agent 的默认模型厂商未能确认；异构互审（differentVendorFrom）按 fail-closed 会把它视为不可满足而排除">⚠ 厂商未识别</div>`;
  const exp=EXPECTED_VENDOR[a.agent];
  if(exp&&exp!==v)return `<div class="vn" title="adapter 名 ≠ 实际厂商：本机默认模型实际跑在 ${v}">⚠ 实际跑 ${esc(v)}（非 ${exp}）</div>`;
  return `<div class="vn dim" title="实际运行厂商">vendor: ${esc(v)}</div>`;
}
const PRESETS=[
  ['🔍 代码审查','审查这段代码的风险与改进点（把代码贴到下面）：\n'],
  ['🧪 写测试','为下面的函数写单元测试，覆盖边界情况：\n'],
  ['🐛 排查 Bug','这段代码有一个 bug（现象如下），请定位根因并给出修复 patch：\n'],
  ['📖 解释','用简洁的中文解释下面这段代码/概念：\n'],
  ['⚡ 快问快答',''],
];
let mode='ask',STATUS=null,FILTER='all',FAGENT='',FSEARCH='',JOBS=[];

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(n??0);
const fmtT=ts=>{const d=new Date(ts);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
async function api(p,o){const r=await fetch(p,o);const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||r.status);return b}

/* ---------- status / sidebar ---------- */
function renderStatus(s){
  STATUS=s;const b=s.budget||{};
  $('budget').innerHTML=`
    <div class="budget-row"><span>今日请求</span><b>${b.requests??0}${b.caps?.dailyRequests?` / ${b.caps.dailyRequests}`:''}</b></div>
    <div class="budget-row"><span>tokens</span><b>${fmtN((b.tokensIn??0)+(b.tokensOut??0))}${b.caps?.dailyTokens?` / ${fmtN(b.caps.dailyTokens)}`:''}</b></div>
    <div class="budget-row"><span>活跃会话</span><b>${(s.openSessions??[]).length}</b></div>`;
  $('agents').innerHTML=(s.agents||[]).map(a=>{
    const dot=a.authenticated===true?'ok':a.authenticated===false?'err':'warn';
    const sel=$('f-agent').value===a.agent?'sel':'';
    return `<div class="agent ${sel}" data-agent="${a.agent}" onclick="pickAgent('${a.agent}')">
      <span class="avatar" style="background:${AGENT_COLORS[a.agent]||'#5b7cfa'}">${AGENT_SHORT[a.agent]||a.agent.slice(0,2).toUpperCase()}</span>
      <div class="info"><div class="nm">${a.agent} <span class="dot ${dot}" title="认证状态"></span></div>
      <div class="sub">${a.models?.length||0} 模型 · ${a.effortLevels?.length||0} 档</div>
      ${vendorNote(a)}</div></div>`;
  }).join('');
  if($('f-agent').options.length<=1){
    $('f-agent').innerHTML='<option value="">auto 路由</option>'+(s.agents||[]).map(a=>`<option>${a.agent}</option>`).join('');
    $('f-agent-filter').innerHTML='<option value="">全部 agent</option><option value="auto">auto</option>'+(s.agents||[]).map(a=>`<option>${a.agent}</option>`).join('');
  }
  agentChanged();
}
function pickAgent(a){
  $('f-agent').value=$('f-agent').value===a?'':a;
  renderStatus(STATUS);agentChanged();saveForm();
}
function agentChanged(){
  const a=STATUS?.agents?.find(x=>x.agent===$('f-agent').value);
  $('model-list').innerHTML=(a?.models||[]).map(m=>`<option value="${esc(m)}">`).join('');
  $('effort-list').innerHTML=(a?.effortLevels||[]).map(e=>`<option value="${esc(e)}">`).join('');
}

/* ---------- composer ---------- */
function setMode(m){
  mode=m;
  $('tab-ask').classList.toggle('on',m==='ask');$('tab-batch').classList.toggle('on',m==='batch');
  $('batch-box').style.display=m==='batch'?'':'none';$('ask-box').style.display=m==='batch'?'none':'';
}
$('tab-ask').onclick=()=>setMode('ask');$('tab-batch').onclick=()=>setMode('batch');
$('presets').innerHTML=PRESETS.map((p,i)=>`<button data-i="${i}" title="${esc(p[1].slice(0,60))}…">${p[0]}</button>`).join('');
$('presets').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('f-task').value=PRESETS[+b.dataset.i][1];$('f-task').focus()};

function collectForm(){
  return{cwd:$('f-cwd').value.trim(),agent:$('f-agent').value||undefined,model:$('f-model').value.trim()||undefined,
    effort:$('f-effort').value.trim()||undefined,taskType:$('f-tasktype').value||undefined,
    workspaceMode:$('f-wsmode').value,verdict:$('f-verdict').checked||undefined,
    maxToolCalls:$('f-maxtools').value?Number($('f-maxtools').value):undefined};
}
function saveForm(){try{localStorage.setItem('acp-form',JSON.stringify({...collectForm(),cwd:$('f-cwd').value,concurrency:$('f-concurrency').value}))}catch{}}
function restoreForm(){
  try{const f=JSON.parse(localStorage.getItem('acp-form')||'{}');
    if(f.cwd)$('f-cwd').value=f.cwd;if(f.concurrency)$('f-concurrency').value=f.concurrency;
    if(f.agent)$('f-agent').value=f.agent;if(f.model)$('f-model').value=f.model;
    if(f.effort)$('f-effort').value=f.effort;if(f.taskType)$('f-tasktype').value=f.taskType;
    if(f.workspaceMode)$('f-wsmode').value=f.workspaceMode;if(f.verdict)$('f-verdict').checked=true;
    if(f.maxToolCalls)$('f-maxtools').value=f.maxToolCalls;
  }catch{}
}
$('btn-go').onclick=async()=>{
  $('form-err').textContent='';const btn=$('btn-go');btn.disabled=true;
  try{
    const base=collectForm();
    if(mode==='ask'){
      const task=$('f-task').value.trim();if(!task)throw new Error('任务内容不能为空');
      await api('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({task,...base})});
      $('f-task').value='';
    }else{
      const tasks=$('f-batchtasks').value.split('\n').map(t=>t.trim()).filter(Boolean);
      if(!tasks.length)throw new Error('批量任务列表为空');
      await api('/api/parallel',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({concurrency:Number($('f-concurrency').value)||3,jobs:tasks.map((task,i)=>({id:`job-${i+1}`,task,...base}))})});
      $('f-batchtasks').value='';
    }
    saveForm();refreshJobs(true);
  }catch(e){$('form-err').textContent=String(e.message??e)}
  finally{btn.disabled=false}
};
$('btn-clear').onclick=async()=>{await fetch('/api/jobs/clear',{method:'POST'});refreshJobs(true)};

/* ---------- jobs feed ---------- */
function jobState(j){
  if(j.status==='running')return{cls:'st-running',pill:'<span class="pill running">● 运行中</span>'};
  const ok=j.kind==='ask'?j.result?.ok:j.result?.summary?.failed===0;
  return j.status==='failed'||ok===false
    ?{cls:'st-err',pill:'<span class="pill err">✕ 失败</span>'}
    :{cls:'st-ok',pill:`<span class="pill ${j.kind==='parallel'?'batch':'ok'}">✓ ${j.kind==='parallel'?'批次完成':'完成'}</span>`};
}
function evLine(e){
  const t=new Date(e.at).toLocaleTimeString('zh-CN',{hour12:false});
  const tag=e.jobId?`[${e.jobId}] `:'';
  if(e.kind==='text')return`<div class="ev t-text"><span class="k">${t} 📝</span>${esc(tag+(e.text||'').slice(0,160))}</div>`;
  if(e.kind==='tool')return`<div class="ev t-tool"><span class="k">${t} 🔧</span>${esc(tag)}工具：${esc((e.text||'tool').slice(0,100))}</div>`;
  if(e.kind==='subtask_done')return`<div class="ev t-done"><span class="k">${t} ✓</span>${esc(tag+(e.text||'子任务结束'))}</div>`;
  return`<div class="ev t-status"><span class="k">${t} ·</span>${esc(tag+(e.text||e.kind).slice(0,120))}</div>`;
}
function renderJobs(list){
  const filtered=list.filter(j=>{
    if(FILTER!=='all'){const st=jobState(j);if(FILTER==='running'&&st.cls!=='st-running')return false;if(FILTER==='ok'&&st.cls!=='st-ok')return false;if(FILTER==='err'&&st.cls!=='st-err')return false;}
    if(FAGENT&&FAGENT!=='auto'){const ag=j.kind==='parallel'?null:(j.request.agent||j.result?.agent);if(ag!==FAGENT)return false;if(FAGENT==='auto'&&(j.request.agent||j.result?.agent))return false;}
    if(FSEARCH&&!String(j.request.task).toLowerCase().includes(FSEARCH))return false;
    return true;});
  $('job-count').textContent=`${filtered.length}/${list.length}`;
  if(!filtered.length){$('jobs').innerHTML='<div class="empty">没有匹配的作业</div>';return}
  $('jobs').innerHTML=filtered.map(j=>{
    const st=jobState(j);
    const task=j.kind==='parallel'?`批量 ${j.request.jobs.length} 个任务 · 并发 ${j.request.concurrency||3}`:String(j.request.task).slice(0,120);
    const ag=j.kind==='parallel'?'parallel':(j.request.agent||j.result?.agent||'auto');
    const dur=j.finishedAt?((j.finishedAt-j.createdAt)/1000).toFixed(1)+'s':'';
    return`<details class="job ${st.cls}" data-id="${j.id}" ontoggle="onToggle(this)">
      <summary class="job-h" onclick="toggleOpen(event,this)">${st.pill}
        <span class="jid">${j.id}</span>
        <span class="avatar" style="width:20px;height:20px;font-size:8px;border-radius:6px;background:${AGENT_COLORS[ag]||'#5b7cfa'}">${AGENT_SHORT[ag]||'AU'}</span>
        <span class="jtask">${esc(task)}</span>
        <span class="jmeta">${esc(ag)}${dur?' · '+dur:''} · ${fmtT(j.createdAt)}</span></summary>
      <div class="jbody">${renderBody(j)}</div></details>`;
  }).join('');
}
function toggleOpen(ev,el){ev.preventDefault();el.parentElement.classList.toggle('open')}
function onToggle(el){/* hook for future lazy-load */}
function renderBody(j){
  if(j.status==='running'){
    const evs=(j.events||[]).slice(-10).map(evLine).join('')||'<div class="ev t-status">等待 agent 子进程输出…</div>';
    const subs=j.kind==='parallel'?subChips(j):'';
    return`<div class="livelog">${evs}</div>${subs}`;
  }
  if(j.status==='failed')return`<div class="reply" style="color:var(--err)">${esc(j.error||'未知错误')}</div>`;
  const r=j.result||{};
  if(j.kind==='ask'){
    COPYBUF[j.id]=r.text||'';
    const v=r.verdict?`<div class="verdict"><b>verdict：</b>${esc(r.verdict.recommendation||r.verdict.conclusion||'')}
      ${(r.verdict.risks||[]).length?`<ul>${r.verdict.risks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`:'';
    const u=r.usage?`<span>tokens <b>${fmtN(r.usage.input||0)}入/${fmtN(r.usage.output||0)}出</b></span>`:'';
    // F3 (issue #2): a successful result must never render in red — only surface `error`
    // when the job actually failed. The fallback trail is a muted diagnostic note.
    const err=r.ok?'' : (r.error?`<div class="reply" style="color:var(--err)">${esc(r.error)}</div>`:'');
    const trail=r.fallbackTrail?`<div class="reply" style="color:var(--faint);font-size:12px">fallback：${esc(r.fallbackTrail)}</div>`:'';
    return`${err}${trail}
      <div class="reply">${esc(r.text||'(空回复)')}</div>${v}
      <div class="rrow">${u}<span>工具调用 <b>${r.toolCalls??0}</b></span><span>agent <b>${esc(r.agent||'')}</b>${r.model?` · ${esc(r.model)}`:''}${r.effort?` · ${esc(r.effort)}`:''}</span>
      ${r.workspace?.kind==='worktree'?`<span>worktree <b>${esc(r.workspace.branch||'')}</b></span>`:''}
      ${r.verdictError?`<span style="color:var(--err)">verdict 解析失败（原文见 raw）</span>`:''}</div>
      <button class="btn-copy" onclick="copyText(this,'${j.id}')">复制回复</button>
      <details class="raw"><summary>原始 JSON</summary><pre class="rawj">${esc(JSON.stringify(r,null,2))}</pre></details>`;
  }
  const s=r.summary||{};
  return`<div class="rrow"><span>结果 <b>${s.ok}✓ / ${s.failed}✕</b></span><span>耗时 <b>${(s.durationMs/1000).toFixed(1)}s</b>（并发节省 <b>${((s.wallVsSerialMsSaved||0)/1000).toFixed(1)}s</b>）</span>
    <span>tokens <b>${fmtN(s.usage?.input||0)}入/${fmtN(s.usage?.output||0)}出</b></span></div>
    <div class="subchips">${subChips(j)}</div>
    <details class="raw"><summary>原始 JSON</summary><pre class="rawj">${esc(JSON.stringify(r,null,2))}</pre></details>`;
}
function subChips(j){
  if(j.kind!=='parallel')return'';
  if(j.status==='done'&&(j.result?.results)){
    return j.result.results.map(x=>`<span class="schip ${x.ok?'ok':'err'}" title="${esc((x.result?.text||x.error||'').slice(0,200))}">${x.ok?'✓':'✕'} ${esc(x.id)} · ${esc(((x.result?.text??'')||x.error||'').slice(0,40))}</span>`).join('');
  }
  // running: derive per-subtask status from the event stream
  const done=new Set(),err=new Set();
  for(const e of j.events||[])if(e.kind==='subtask_done'&&e.jobId)(String(e.text||'').startsWith('完成')?done:err).add(e.jobId);
  return(j.request.jobs||[]).map((t,i)=>{
    const id=t.id||`job-${i+1}`;
    const cls=err.has(id)?'err':done.has(id)?'ok':'run';
    const mark=err.has(id)?'✕':done.has(id)?'✓':'◌';
    return`<span class="schip ${cls}">${mark} ${esc(id)}：${esc(String(t.task).slice(0,36))}</span>`;
  }).join('');
}
function copyText(btn,id){navigator.clipboard.writeText(COPYBUF[id]||'').then(()=>{btn.textContent='已复制 ✓';setTimeout(()=>btn.textContent='复制回复',1200)})}

/* filters */
document.querySelectorAll('.fchip').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('.fchip').forEach(x=>x.classList.remove('on'));c.classList.add('on');
  FILTER=c.dataset.f;renderJobs(JOBS);});
$('f-agent-filter').onchange=e=>{FAGENT=e.target.value;renderJobs(JOBS)};
$('f-search').oninput=e=>{FSEARCH=e.target.value.toLowerCase();renderJobs(JOBS)};

/* ---------- settings view (v3) ---------- */
let SETSECTION='agents',AGENTS=[],CREDENTIALS=[],SETTINGS=null;
const DRAFT={};   // per-agent staged draft; discarded when the card closes without saving
const OPENID={};  // which agent card stays expanded

function switchView(v){
  $('nav-console').classList.toggle('on',v==='console');
  $('nav-settings').classList.toggle('on',v==='settings');
  $('view-console').style.display=v==='console'?'':'none';
  $('view-settings').style.display=v==='settings'?'':'none';
  $('btn-clear').style.display=v==='console'?'':'none';
  $('view-title').textContent=v==='console'?'控制台':'设置';
  if(v==='settings')loadSettings();
}
function setSection(s){
  SETSECTION=s;
  document.querySelectorAll('.subnav .navbtn').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  renderSettings();
}
async function loadSettings(){
  try{
    const [a,c,s]=await Promise.all([api('/api/agents'),api('/api/credentials'),api('/api/settings')]);
    AGENTS=a.agents;CREDENTIALS=c.credentials;SETTINGS=s;
    renderSettings();
    fillCwdList();
  }catch(e){$('settings-body').innerHTML=`<div class="card"><div class="empty">加载失败：${esc(String(e.message??e))}</div></div>`}
}
function fillCwdList(){
  const cwds=SETTINGS?.merged?.workspace?.recentCwds||[];
  $('cwd-list').innerHTML=cwds.map(c=>`<option value="${esc(c)}">`).join('');
  // No hardcoded default path (PR #1 follow-up): prefill from the user's own recent list.
  if(!$('f-cwd').value&&cwds.length)$('f-cwd').value=cwds[0];
}
function renderSettings(){
  if(SETSECTION==='agents'){$('settings-body').innerHTML=renderAgents();}
  else if(SETSECTION==='routing'){$('settings-body').innerHTML=renderRouting();}
  else if(SETSECTION==='budget'){$('settings-body').innerHTML=renderBudget();}
  else if(SETSECTION==='workspace'){$('settings-body').innerHTML=renderWorkspace();}
  else{renderIntegr();}
}

/* --- routing --- */
function renderRouting(){
  const e=SETTINGS?.effectiveRouting||{};const u=SETTINGS?.user?.routing?.rules||{};
  const types=['quick','code','reasoning','review'];
  const rows=types.map(t=>{
    const eff=e[t]||{};const ov=u[t];
    return`<div class="rule-row"><b>${t}</b>
      <select id="rt-agent-${t}">${['','opencode','claude','codex','dsh'].map(x=>`<option value="${x}"${(ov?.agent||eff.agent)===x?' selected':''}>${x||'(默认)'}</option>`).join('')}</select>
      <input id="rt-effort-${t}" value="${esc(ov?.effort??eff.effort??'')}" placeholder="档位（空=agent 默认）">
      <span class="jid">${ov?'已覆盖':'默认'}</span></div>`;
  }).join('');
  return`<div class="card"><h2 class="ct">路由规则（任务类型 → agent）</h2>${rows}
    <label class="check"><input type="checkbox" id="rt-llm" ${SETTINGS?.merged?.routing?.llmRouter!==false?'checked':''}> LLM 路由兜底（规则未命中时用便宜模型分类任务类型，可用 0 关闭）</label>
    <button id="btn-go" onclick="saveRouting()">保存路由设置</button><div class="form-err" id="rt-err"></div></div>`;
}
async function saveRouting(){
  const rules={};
  for(const t of ['quick','code','reasoning','review']){
    const agent=$(`rt-agent-${t}`).value;
    const effort=$(`rt-effort-${t}`).value.trim();
    const eff=SETTINGS?.effectiveRouting?.[t]||{};
    if(agent && (agent!==eff.agent || effort!==(eff.effort||''))) rules[t]={agent,effort:effort||undefined};
  }
  try{
    await api('/api/settings',{method:'PUT',headers:{'content-type':'application/json'},
      body:JSON.stringify({routing:{rules,llmRouter:$('rt-llm').checked}})});
    $('rt-err').textContent='';
    await loadSettings();
  }catch(e){$('rt-err').textContent=String(e.message??e)}
}

/* --- budget --- */
function renderBudget(){

  const pa=b.perAgent?Object.entries(b.perAgent).map(([k,v])=>`<span class="credchip">${esc(k)} × ${v}</span>`).join(''):'<span style="color:var(--faint)">（本日暂无分 agent 数据）</span>';
  return`<div class="card"><h2 class="ct">今日用量</h2>
    <div class="usage-row"><span>请求次数</span><b>${b.requests??0}${b.caps?.dailyRequests?` / ${b.caps.dailyRequests}`:''}</b></div>

    <h2 class="ct" style="margin-top:16px">每日上限（0 = 不限）</h2>

      <div><label>请求次数上限</label><input id="bd-req" type="number" value="${m.dailyRequests??0}"></div>

async function saveBudget(){

    await api('/api/settings',{method:'PUT',headers:{'content-type':'application/json'},

async function resetBudget(){

}

/* --- workspace --- */

function rmCwd(c){

}
async function saveWorkspace(){

    await api('/api/settings',{method:'PUT',headers:{'content-type':'application/json'},
      body:JSON.stringify({workspace:{worktreeBaseDir:$('ws-basedir').value.trim()||null}})});

/* --- integrations --- */
async function renderIntegr(){
  $('settings-body').innerHTML='<div class="card"><h2 class="ct">集成</h2><div class="empty">加载中…</div></div>';
  try{
    const r=await api('/api/integrations');
    $('settings-body').innerHTML=`<div class="card"><h2 class="ct">MCP 接入（给 Claude Code / Codex 的 .mcp.json）</h2>
      <pre class="rawj">${esc(r.mcpSnippet)}</pre>
      <button class="btn-copy" onclick="copyRaw(this)">复制配置</button>
      <h2 class="ct" style="margin-top:16px">Web 控制台</h2>
      <div class="usage-row"><span>监听地址</span><b>${r.bind}:${r.webPort}</b></div>
      <div style="color:var(--faint);font-size:12px;margin-top:8px">仅绑定本机回环地址；不要暴露到局域网/公网。</div></div>`;
  }catch(e){$('settings-body').innerHTML=`<div class="card"><div class="empty">${esc(String(e.message??e))}</div></div>`}
}
function copyRaw(btn){
  const txt=btn.parentElement.querySelector('pre').textContent;
  navigator.clipboard.writeText(txt).then(()=>{btn.textContent='已复制 ✓';setTimeout(()=>btn.textContent='复制配置',1200)});
}
function renderAgents(){
  const creds=CREDENTIALS.map(c=>`<span class="credchip"><span class="dot ${c.configured?'ok':'err'}"></span>${esc(c.name)}<span style="color:var(--faint)">· ${c.configured?esc(c.source):'未配置'}</span></span>`).join('');
  const rows=AGENTS.map(a=>agentRowHtml(a)).join('');
  const usable=AGENTS.some(a=>a.enabled&&a.authState==='ok');
  const onboarding=usable?'':`<div class="verdict" style="margin-bottom:12px"><b>首次设置：</b>还没有任何可用的 agent 凭据。展开下面任意一个 agent，粘贴它的 API Key 并「探测能力」；或用「+ 添加自定义 Agent」接入你自己的 ACP 命令。值只写不回显。</div>`;
  return`<div class="card">${onboarding}<h2 class="ct">凭据（值只写不回显 · 环境变量优先，其次 secrets.env）</h2><div class="credstrip">${creds}</div>
    <h2 class="ct" style="margin-top:6px">Agents · 点击行展开编辑（一次一张卡）</h2>${rows}
    <button class="ghost" style="width:auto;margin-top:6px" onclick="toggleCustom()">+ 添加自定义 Agent</button>
    <div id="custom-card" style="display:none;margin-top:10px">${customCardHtml()}</div></div>`;
}
function customCardHtml(){
  return`<div class="agentrow open" style="border-color:var(--acc1)"><div class="aedit" style="display:block;border-top:0">
    <div class="grid3">
      <div><label>Agent ID（唯一）</label><input id="cu-id" placeholder="如 gemini"></div>
      <div><label>传输方式</label><select id="cu-transport"><option value="acp">ACP</option><option value="json-process">JSON-process</option></select></div>
      <div><label>凭据引用名</label><input id="cu-cred" placeholder="如 GEMINI_API_KEY（可空）"></div>
    </div>
    <label>命令</label><input id="cu-command" placeholder="node 或可执行文件绝对路径">
    <label>参数（每行一个）</label><textarea id="cu-args" style="min-height:52px" placeholder="例如 ACP 适配器：&#10;C:\\...\\gemini-cli-acp\\dist\\index.js"></textarea>
    <div><label>凭据值（只写，可留空用原生登录态）</label><input type="password" id="cu-credval" autocomplete="new-password"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="ghost" style="flex:1;margin:0" onclick="toggleCustom()">取消</button>
      <button id="btn-cu" style="flex:2;margin:0" onclick="addCustom()">保存并探测</button>
    </div>
    <div class="probebox" id="probe-custom" style="display:none"></div>
  </div></div>`;
}
function toggleCustom(){const c=$('custom-card');c.style.display=c.style.display==='none'?'':'none'}
async function addCustom(){
  const id=($('cu-id').value||'').trim();
  const btn=$('btn-cu');btn.disabled=true;
  const box=$('probe-custom');box.style.display='';box.textContent='保存并探测中…';
  try{
    if(!id||/[\s/\\]/.test(id))throw new Error('Agent ID 不能为空且不能含空格/斜杠');
    if(AGENTS.some(a=>a.id===id))throw new Error(`agent ${id} 已存在`);
    const command=($('cu-command').value||'').trim();
    if(!command)throw new Error('命令不能为空');
    const args=$('cu-args').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const credRef=($('cu-cred').value||'').trim()||null;
    const patch={enabled:true,transport:$('cu-transport').value,command,args,credentialRef:credRef};
    await api('/api/settings',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({agents:{[id]:patch}})});
    const credVal=($('cu-credval').value||'').trim();
    if(credRef&&credVal)await api(`/api/credentials/${credRef}`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({value:credVal})});
    const r=await api(`/api/agents/${id}/test`,{method:'POST'});
    box.textContent=r.ok?`✓ ${id} 接入成功（${(r.durationMs/1000).toFixed(1)}s）——已可被路由。\n模型: ${(r.models||[]).slice(0,10).join(', ')||'(未上报)'}`
      :`⚠ 已保存但探测失败：${r.error||r.detail||'未知原因'}\n命令或凭据可能有误，可在列表中展开修改后重新探测。`;
    refreshStatus();
    setTimeout(loadSettings,r.ok?400:1200);
  }catch(e){box.textContent='✕ '+String(e.message??e)}
  finally{btn.disabled=false}
}
function agentRowHtml(a){
  const open=OPENID[a.id]?'open':'';
  const dot=a.authState==='ok'?'ok':a.authState==='missing'?'err':'warn';
  const warn=a.id==='claude'&&a.credentialNative?'⚠ 本机重映射到 DeepSeek':'';
  const d=DRAFT[a.id]??(DRAFT[a.id]={enabled:a.enabled,transport:a.transport,command:a.command||'',
    argsText:(a.args||[]).join('\n'),credentialRef:a.credentialRef||'',credentialValue:'',
    model:a.defaults?.model||'',effort:a.defaults?.effort||'',mode:a.defaults?.mode||'',
    maxToolCalls:a.limits?.maxToolCalls??'',timeoutMs:a.limits?.timeoutMs??''});
  const models=(STATUS?.agents?.find(x=>x.agent===a.id)?.models)||[];
  const efforts=(STATUS?.agents?.find(x=>x.agent===a.id)?.effortLevels)||[];
  return`<div class="agentrow ${open}" id="ag-${esc(a.id)}">
    <div class="arow" onclick="toggleAgent('${esc(a.id)}')">
      <span class="dot ${dot}"></span><b style="min-width:76px">${esc(a.id)}</b>
      <span class="jid">${esc(a.transport)}</span>
      ${a.enabled?'':'<span class="badge-dis">已禁用</span>'}
      <span class="jtask" style="flex:1;color:var(--faint)">${esc(d.command||'')}${warn?` · ${warn}`:''}</span>
      <span class="jmeta">${a.credential?`凭据 ${a.credential.configured?'✓ '+esc(a.credential.source):'✕ 未配置'}`:(a.nativeAuthPresent?'凭据 ✓ 原生':'')}</span>
    </div>
    <div class="aedit">
      <div class="grid3">
        <div><label>启用</label><label class="switch" style="margin-top:6px"><input type="checkbox" ${d.enabled?'checked':''} oninput="upd('${esc(a.id)}','enabled',this.checked)"><span></span></label></div>
        <div><label>传输方式</label><select oninput="upd('${esc(a.id)}','transport',this.value)">
          <option value="acp"${d.transport==='acp'?' selected':''}>ACP</option>
          <option value="json-process"${d.transport==='json-process'?' selected':''}>JSON-process</option></select></div>
        <div><label>凭据引用名</label><input value="${esc(d.credentialRef)}" placeholder="如 OPENAI_API_KEY" oninput="upd('${esc(a.id)}','credentialRef',this.value)"></div>
      </div>
      <label>命令</label><input value="${esc(d.command)}" oninput="upd('${esc(a.id)}','command',this.value)">
      <label>参数（每行一个）</label><textarea style="min-height:52px" oninput="upd('${esc(a.id)}','argsText',this.value)">${esc(d.argsText)}</textarea>
      <div class="grid3">
        <div><label>默认模型</label><input value="${esc(d.model)}" list="dl-m-${esc(a.id)}" placeholder="agent 自身默认" oninput="upd('${esc(a.id)}','model',this.value)">
          <datalist id="dl-m-${esc(a.id)}">${models.map(m=>`<option value="${esc(m)}">`).join('')}</datalist></div>
        <div><label>默认思考档位</label><input value="${esc(d.effort)}" list="dl-e-${esc(a.id)}" placeholder="auto" oninput="upd('${esc(a.id)}','effort',this.value)">
          <datalist id="dl-e-${esc(a.id)}">${efforts.map(e=>`<option value="${esc(e)}">`).join('')}</datalist></div>
        <div><label>默认模式</label><input value="${esc(d.mode)}" placeholder="如 acceptEdits" oninput="upd('${esc(a.id)}','mode',this.value)"></div>
      </div>
      <div class="grid3">
        <div><label>工具调用上限</label><input type="number" value="${esc(String(d.maxToolCalls))}" placeholder="不限" oninput="upd('${esc(a.id)}','maxToolCalls',this.value)"></div>
        <div><label>超时 ms</label><input type="number" value="${esc(String(d.timeoutMs))}" placeholder="300000" oninput="upd('${esc(a.id)}','timeoutMs',this.value)"></div>
        <div><label>新凭据值（只写）</label>
          <div style="display:flex;gap:6px"><input type="password" autocomplete="new-password" id="credval-${esc(a.id)}" placeholder="${a.credential?.configured?'已配置 · '+esc(a.credential.source):'未配置'}">
          <button class="ghost" style="margin:0" onclick="saveCredential('${esc(a.id)}')">存</button></div></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="ghost" style="flex:1;margin:0" onclick="probe('${esc(a.id)}')">🔌 探测能力</button>
        <button class="ghost" style="flex:1;margin:0" onclick="resetAgent('${esc(a.id)}')">恢复默认</button>
        <button id="btn-save-${esc(a.id)}" style="flex:1.4;margin:0;margin-top:0" onclick="saveAgent('${esc(a.id)}')">保存修改</button>
      </div>
      <div class="probebox" id="probe-${esc(a.id)}" style="display:none"></div>
    </div>
  </div>`;
}
function toggleAgent(id){
  const el=$('ag-'+id);const wasOpen=el.classList.contains('open');
  document.querySelectorAll('.agentrow.open').forEach(x=>x.classList.remove('open'));
  if(!wasOpen){el.classList.add('open');OPENID[id]=true;}
  else delete OPENID[id];
}
function upd(id,k,v){if(DRAFT[id])DRAFT[id][k]=v}
async function saveAgent(id){
  const btn=$('btn-save-'+id);btn.disabled=true;
  try{
    const srv=AGENTS.find(a=>a.id===id);const d=DRAFT[id];
    const patch={};
    if(d.enabled!==srv.enabled)patch.enabled=d.enabled;
    if(d.transport!==srv.transport)patch.transport=d.transport;
    if(d.command!==srv.command)patch.command=d.command;
    const args=d.argsText.split('\n').map(s=>s.trim()).filter(Boolean);
    if(JSON.stringify(args)!==JSON.stringify(srv.args||[]))patch.args=args;
    if((d.credentialRef||null)!==(srv.credentialRef||null))patch.credentialRef=d.credentialRef||null;
    const defaults={};
    if((d.model||undefined)!==(srv.defaults?.model||undefined))defaults.model=d.model||undefined;
    if((d.effort||undefined)!==(srv.defaults?.effort||undefined))defaults.effort=d.effort||undefined;
    if((d.mode||undefined)!==(srv.defaults?.mode||undefined))defaults.mode=d.mode||undefined;
    if(Object.keys(defaults).length)patch.defaults=defaults;
    const limits={};
    if(String(d.maxToolCalls??'')!==String(srv.limits?.maxToolCalls??''))limits.maxToolCalls=d.maxToolCalls===''||d.maxToolCalls===null?null:Number(d.maxToolCalls);
    if(String(d.timeoutMs??'')!==String(srv.limits?.timeoutMs??''))limits.timeoutMs=d.timeoutMs===''||d.timeoutMs===null?null:Number(d.timeoutMs);
    if(Object.keys(limits).length)patch.limits=limits;
    if(!Object.keys(patch).length){showProbe(id,'没有改动，无需保存。');return}
    await api('/api/settings',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({agents:{[id]:patch}})});
    showProbe(id,'✓ 已保存并即时生效。');
    await loadSettings();refreshStatus();
  }catch(e){showProbe(id,'✕ 保存失败：'+String(e.message??e))}
  finally{btn.disabled=false}
}
async function resetAgent(id){
  try{
    await api('/api/settings/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({section:'agents',sub:id})});
    delete DRAFT[id];delete OPENID[id];
    await loadSettings();refreshStatus();
  }catch(e){showProbe(id,'✕ 重置失败：'+String(e.message??e))}
}
async function probe(id){
  const box=$('probe-'+id);box.style.display='';box.textContent='探测中…（initialize + session/new，不消耗 token）';
  try{
    const r=await api(`/api/agents/${id}/test`,{method:'POST'});
    box.textContent=r.ok
      ?`✓ ${r.detail||'探测成功'} · ${(r.durationMs/1000).toFixed(1)}s\n模型: ${(r.models||[]).slice(0,12).join(', ')||'(未上报)'}\n档位: ${(r.efforts||[]).join(', ')||'(未上报)'}`
      :`✕ 探测失败（${(r.durationMs/1000).toFixed(1)}s）：${r.error||r.detail||'未知原因'}`;
    refreshStatus();
  }catch(e){box.textContent='✕ 探测失败：'+String(e.message??e)}
}
async function saveCredential(id){
  const a=AGENTS.find(x=>x.id===id);
  const ref=(DRAFT[id]?.credentialRef||a?.credentialRef||'').trim();
  if(!ref){showProbe(id,'✕ 先填写凭据引用名（环境变量名）');return}
  const val=$('credval-'+id).value;
  if(!val){showProbe(id,'✕ 凭据值为空（留空即删除请用删除语义——这里不做空写）');return}
  try{
    await api(`/api/credentials/${ref}`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({value:val})});
    $('credval-'+id).value='';
    showProbe(id,`✓ 凭据 ${ref} 已写入 secrets.env（立即生效，值不会回显）`);
    const c=await api('/api/credentials');CREDENTIALS=c.credentials;
    await loadSettings();
  }catch(e){showProbe(id,'✕ 写入失败：'+String(e.message??e))}
}
function showProbe(id,text){const b=$('probe-'+id);if(b){b.style.display='';b.textContent=text}}

/* ---------- polling ---------- */
async function refreshStatus(){
  try{renderStatus(await api('/api/status'));
    $('conn-dot').className='dot ok';$('conn-text').textContent='已连接';}
  catch{$('conn-dot').className='dot err';$('conn-text').textContent='断开';}
}
async function refreshJobs(force){
  try{
    const list=await api('/api/jobs');
    JOBS=list;renderJobs(list);
    // auto-scroll open running livelogs
    document.querySelectorAll('details.job.open.st-running .livelog').forEach(el=>{el.scrollTop=el.scrollHeight});
  }catch{}
}
restoreForm();setMode('ask');refreshStatus();refreshJobs(true);
api('/api/settings').then(s=>{SETTINGS=s;fillCwdList();}).catch(()=>{});
setInterval(refreshStatus,5000);setInterval(refreshJobs,1200);
</script>
